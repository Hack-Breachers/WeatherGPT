name: weathergpt
description: WeatherGPT - AI-powered weather and disaster safety assistant
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  qr_flutter: ^4.1.0

  flutter_phone_direct_caller: ^2.1.1
  telephony: ^0.2.0

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  url_launcher: ^6.3.2
  geolocator: ^14.0.3
  nearby_connections: ^4.3.0
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons : ^0.14.4

  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_logo.png"

flutter:
  uses-material-design: true